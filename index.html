<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fireworks! 🔥</title>
    <style>
      /* The brightness ramp assumes more ink means more light, so the page
         has to be dark for it to read the right way round. On the browser
         default of dark text on white, a dim sky becomes grey smudges, the
         brightest firework is the darkest thing on screen, and a sunset
         cannot be shown at all. See docs/06_world_backdrop.md. */
      body {
        margin: 0;
        padding: 1rem;
        background: #05060a;
        color: #cfd6e6;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      /* Character cells are roughly twice as tall as they are wide, and at
         the default leading of about 1.2 a 40-row grid shows visible gaps
         between rows — a filled sky reads as a dotted field rather than a
         continuous one. This matters as much as the colour does. */
      pre {
        margin: 0;
        line-height: 1;
      }
      /* An emoji cell is close to square already at line-height 1, unlike
         a monospace character cell, which is roughly twice as tall as it
         is wide. Composing the 40x40 emoji grid at line-height 1 would
         therefore stretch the world vertically; this compresses row
         spacing back down until the cell reads square again. Tuned by eye
         against a rendered `ring` burst — see docs/07_emoji_renderer.md. */
      pre.emoji {
        line-height: 1.2;
      }
      /* The two instruction lines have to out-rank both pixel canvases
         regardless of z-index values: a positioned element with
         z-index:0 or higher always paints above non-positioned content,
         whatever the DOM order, so without this the text vanishes
         whenever ?renderer=pixel is active. Harmless for ascii/emoji,
         which never position anything here. */
      #app > p {
        position: relative;
        z-index: 2;
      }
      /* Draws the internal buffer (a few hundred pixels) blown up to
         fill the screen with hard block edges, not a blur — the whole
         reason this renderer reads as 8-bit rather than as a blurry
         low-res image. See docs/09_8bit_renderer.md. */
      canvas.pixel {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }
      /* Two stacked planes, not one: the sky/scenery canvas painted once
         and left alone, the sprite canvas cleared and redrawn every
         frame. Neither uses z-index: -1 — that would paint behind the
         page's own opaque background and vanish outright. */
      canvas.pixel-background {
        z-index: 0;
      }
      canvas.pixel-sprites {
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
